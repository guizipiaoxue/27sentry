# 下列字段是标定记录信息；由标定工具生成，不作为 ROS 参数读取。
# 标定方法名称、使用的数据包和施加的几何约束。
calibration_method: raw_cloud_fixed_yaw_pivot_train_first30s
source_bag: 20260919_205858_plio
constraint: fixed_yaw_pivot_z_zero_heading_preserved
