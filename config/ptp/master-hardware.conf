[global]
# Template only: replace enp86s0 with the lidar-facing hardware timestamp NIC.
twoStepFlag 1
time_stamping hardware
network_transport UDPv4
delay_mechanism E2E
domainNumber 0
priority1 10
priority2 10
clockClass 248
clockAccuracy 0xFE
offsetScaledLogVariance 0xFFFF
utc_offset 37
logAnnounceInterval 1
logSyncInterval 0
logMinDelayReqInterval 0
# Separate sockets for every instance when multiple NICs have different PHCs.
uds_address /run/ptp4l-enp86s0

[enp86s0]
# linuxptp 3.1 uses masterOnly; newer versions may call this serverOnly.
masterOnly 1
