/**:
  ros__parameters:
    # DLIO keyframe clouds are already transformed into the odom frame.
    map.frame: odom
    map.strict_frame: true

    # Preserve dense keyframes. A 1 mm radius rejects numerical duplicates only.
    map.min_point_spacing: 0.001
    map.min_z: -1000.0
    map.max_z: 1000.0
    # Hard safety limit; 20 million PointXYZI values use about 320 MB before
    # accounting for the KD-tree index and temporary insertion buffers.
    map.max_points: 20000000

    map.save_path: maps/dlio_kdtree_map.pcd
